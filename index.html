<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1728'/%3E%3Cpath d='M6 16.5 12 6l6 10.5' stroke='%23ff6b1c' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCE Flow — CGPP Office of the City Engineer, Puerto Princesa</title>
    <style>
      /* Instant, dependency-free boot screen — replaced the moment React mounts. */
      html, body { margin: 0; background: #071120; }
      #boot-sentinel {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background:
          radial-gradient(900px 600px at 85% -10%, rgba(86,200,240,.09), transparent 60%),
          radial-gradient(800px 560px at -10% 110%, rgba(255,107,28,.08), transparent 55%),
          #071120;
        font-family: 'Public Sans', 'Segoe UI', sans-serif; color: #e4edf6;
      }
      #boot-sentinel .seal { animation: bootPulse 1.6s ease-in-out infinite; }
      #boot-sentinel h1 {
        margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-size: 34px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800;
      }
      #boot-sentinel h1 em { font-style: normal; color: #ff6b1c; }
      #boot-sentinel p { margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: #6684a3; }
      #boot-sentinel .bars { display: flex; flex-direction: column; gap: 7px; width: 220px; margin-top: 6px; }
      #boot-sentinel .bars i { display: block; height: 6px; border-radius: 99px; background: linear-gradient(90deg, #122540, #2fa9d6, #122540); background-size: 200% 100%; animation: bootSlide 1.3s linear infinite; }
      #boot-sentinel .bars i:nth-child(2) { width: 78%; animation-delay: .15s; }
      #boot-sentinel .bars i:nth-child(3) { width: 52%; animation-delay: .3s; }
      @keyframes bootPulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes bootSlide { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-sentinel">
        <svg class="seal" width="64" height="64" viewBox="0 0 48 48" aria-hidden>
          <circle cx="24" cy="24" r="21" fill="none" stroke="#ff6b1c" stroke-width="2.2" />
          <circle cx="24" cy="24" r="16.5" fill="none" stroke="#56c8f0" stroke-width="1.1" opacity=".8" />
          <path d="M14 30.5 24 13l10 17.5" fill="none" stroke="#ff6b1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M17.5 30.5h13" stroke="#56c8f0" stroke-width="2" stroke-linecap="round" />
          <circle cx="24" cy="34.5" r="1.6" fill="#fbc94a" />
        </svg>
        <h1>OCE <em>Flow</em></h1>
        <p>Office of the City Engineer · starting</p>
        <div class="bars"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      // Fail-safe built purely with DOM APIs (no string-escaping hazards):
      // surfaces any startup/runtime error, and detects a hung boot.
      (function () {
        function showFault(title, msg, where) {
          if (document.getElementById('boot-fault')) return;
          var s = document.getElementById('boot-sentinel');
          if (s && s.parentNode) s.parentNode.removeChild(s);

          var wrap = document.createElement('div');
          wrap.id = 'boot-fault';
          wrap.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:9999;background:#071120;';

          var card = document.createElement('div');
          card.style.cssText = 'max-width:580px;border:1px solid #274468;background:#0d1d31;border-radius:10px;padding:28px;font-family:ui-monospace,monospace;color:#e4edf6;';

          var kicker = document.createElement('p');
          kicker.style.cssText = 'margin:0;letter-spacing:.2em;font-size:11px;color:#ff8a4c;text-transform:uppercase;';
          kicker.textContent = 'OCE Flow — ' + title;

          var head = document.createElement('p');
          head.style.cssText = 'font-size:18px;font-weight:700;margin:10px 0 4px;font-family:Segoe UI,sans-serif;';
          head.textContent = 'The app could not start';

          var body = document.createElement('p');
          body.style.cssText = 'font-size:12px;color:#a9c0d6;margin:0 0 6px;word-break:break-word;line-height:1.5;';
          body.textContent = msg || 'Unknown error';

          var loc = document.createElement('p');
          loc.style.cssText = 'font-size:11px;color:#86a2be;margin:0;word-break:break-all;';
          loc.textContent = where || '';

          var hint = document.createElement('p');
          hint.style.cssText = 'font-size:11px;color:#86a2be;margin:14px 0 0;line-height:1.5;';
          hint.textContent = 'Click inside the preview, then hard refresh (Ctrl + Shift + R). If it persists, use the button below to reset saved data.';

          var btn = document.createElement('button');
          btn.textContent = 'Clear data & reseed';
          btn.style.cssText = 'margin-top:14px;padding:9px 16px;border-radius:6px;border:1px solid #274468;background:#122540;color:#e4edf6;cursor:pointer;font-family:inherit;font-size:12px;';
          btn.onclick = function () {
            try {
              Object.keys(localStorage).forEach(function (k) {
                if (k.indexOf('ceoflow') === 0) localStorage.removeItem(k);
              });
            } catch (e) { /* ignore */ }
            location.reload();
          };

          card.appendChild(kicker);
          card.appendChild(head);
          card.appendChild(body);
          card.appendChild(loc);
          card.appendChild(hint);
          card.appendChild(btn);
          wrap.appendChild(card);
          document.body.appendChild(wrap);
        }
        window.addEventListener('error', function (e) {
          showFault('startup fault', e.message, (e.filename || '') + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          showFault('async fault', e.reason && e.reason.message ? e.reason.message : String(e.reason), '');
        });
        // If React has not mounted within 8 seconds, say so explicitly.
        setTimeout(function () {
          if (!window.__OCE_BOOTED__) {
            showFault('boot timeout', 'The interface did not finish loading within 8 seconds — usually a stale cached bundle in the preview.', '');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
